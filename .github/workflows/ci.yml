name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: meal_rescue
          POSTGRES_PASSWORD: local_password
          POSTGRES_DB: meal_rescue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meal_rescue"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      # 127.0.0.1, not localhost: Node >=17 resolves localhost to ::1 first,
      # which can miss the service container's published port on runners.
      TEST_DATABASE_URL: postgresql://meal_rescue:local_password@127.0.0.1:5432/meal_rescue_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run backend tests (unit + integration)
        # Jest output is mirrored into the job summary so failures are
        # readable directly on the run page (job logs need admin access).
        # NOTE: the default shell is `bash -e`; `|| code=$?` keeps the
        # summary-writing lines reachable when the test command fails.
        run: |
          code=0
          npm run test --workspace @meal-rescue/backend > test-output.txt 2>&1 || code=$?
          echo '===== TEST OUTPUT TAIL (also mirrored to run summary) ====='
          tail -n 150 test-output.txt
          {
            echo "### Backend test output (tail)"
            echo '```'
            tail -n 150 test-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

  build-backend:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build --workspace @meal-rescue/shared-types
      - run: npm run build --workspace @meal-rescue/backend
      - uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: apps/backend/dist

  build-mobile:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Typecheck the mobile app; EAS builds happen on release branches.
      - run: npx expo-doctor || true
        working-directory: apps/mobile
